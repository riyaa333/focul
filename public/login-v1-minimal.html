<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focul — Login v1 (Minimal)</title>
<style>
  :root {
    --bg: #faf9f7;
    --bg-2: #f3f1ec;
    --surface: #ffffff;
    --border: rgba(30,55,32,0.10);
    --border-strong: rgba(30,55,32,0.18);
    --text: #0d1f15;
    --text-muted: rgba(13,31,21,0.62);
    --text-faint: rgba(13,31,21,0.42);
    --green-deep: #1e5c30;
    --green-mid: #8dcc9e;
    --green-light: #d4ead8;
    --shadow-md: 0 4px 12px rgba(13,31,21,0.05), 0 24px 64px rgba(13,31,21,0.08);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* Subtle radial accent */
  body::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(600px 400px at 20% 0%, rgba(141,204,158,0.08), transparent 70%),
      radial-gradient(500px 350px at 90% 100%, rgba(212,234,216,0.18), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  nav {
    padding: 24px 32px;
    position: relative;
    z-index: 1;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; letter-spacing: -0.02em;
    color: var(--text);
    text-decoration: none;
  }
  .brand-mark { width: 22px; height: 22px; }
  .brand-mark svg { display: block; width: 100%; height: 100%; }

  main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    position: relative;
    z-index: 1;
  }

  .login-block {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .login-mark {
    width: 56px; height: 56px;
    margin: 0 auto 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: grid; place-items: center;
    box-shadow: 0 1px 3px rgba(13,31,21,0.04);
  }
  .login-mark svg { width: 28px; height: 28px; }

  h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.025em;
    margin-bottom: 10px;
    line-height: 1.15;
  }
  .subhead {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 36px;
  }

  form {
    display: flex; flex-direction: column;
    gap: 14px;
    text-align: left;
    margin-bottom: 24px;
  }

  .field { position: relative; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .field input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .field input:focus {
    outline: none;
    border-color: var(--green-deep);
    box-shadow: 0 0 0 3px rgba(30,92,48,0.08);
  }
  .field input::placeholder { color: var(--text-faint); }

  .field-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .forgot {
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 500;
  }
  .forgot:hover { color: var(--green-deep); }

  .signin-btn {
    width: 100%;
    padding: 14px 24px;
    border-radius: 12px;
    background: var(--text);
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: transform 0.15s var(--ease), opacity 0.2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .signin-btn:hover { transform: translateY(-1px); opacity: 0.94; }

  .divider {
    display: flex; align-items: center; gap: 14px;
    margin: 24px 0 20px;
    color: var(--text-faint);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px;
    background: var(--border);
  }

  .google-btn {
    width: 100%;
    padding: 13px 24px;
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--border);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: border-color 0.15s var(--ease);
  }
  .google-btn:hover { border-color: var(--border-strong); }
  .google-btn svg { width: 18px; height: 18px; }

  .signup-line {
    margin-top: 24px;
    font-size: 14px;
    color: var(--text-muted);
  }
  .signup-line a {
    color: var(--green-deep);
    font-weight: 600;
    text-decoration: none;
  }
  .signup-line a:hover { text-decoration: underline; }

  footer {
    padding: 24px 32px;
    text-align: center;
    font-size: 12px;
    color: var(--text-faint);
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
  <nav>
    <a href="/" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 160 160">
          <rect x="38" y="61" width="12" height="38" rx="6" fill="#d4ead8"/>
          <rect x="56" y="46" width="12" height="69" rx="6" fill="#8dcc9e"/>
          <rect x="74" y="33" width="12" height="94" rx="6" fill="#1e5c30"/>
          <rect x="92" y="46" width="12" height="69" rx="6" fill="#8dcc9e"/>
          <rect x="110" y="61" width="12" height="38" rx="6" fill="#d4ead8"/>
        </svg>
      </span>
      <span>Focul</span>
    </a>
  </nav>

  <main>
    <div class="login-block">
      <div class="login-mark">
        <svg viewBox="0 0 160 160">
          <rect x="38" y="61" width="12" height="38" rx="6" fill="#d4ead8"/>
          <rect x="56" y="46" width="12" height="69" rx="6" fill="#8dcc9e"/>
          <rect x="74" y="33" width="12" height="94" rx="6" fill="#1e5c30"/>
          <rect x="92" y="46" width="12" height="69" rx="6" fill="#8dcc9e"/>
          <rect x="110" y="61" width="12" height="38" rx="6" fill="#d4ead8"/>
        </svg>
      </div>

      <h1>Welcome back to Focul.</h1>
      <p class="subhead">Sign in to start your next session.</p>

      <form>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" />
        </div>

        <div class="field">
          <div class="field-row">
            <label for="password">Password</label>
            <a href="#" class="forgot">Forgot password?</a>
          </div>
          <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button type="submit" class="signin-btn">
          Sign in
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </button>

        <div class="divider">or</div>

        <button type="button" class="google-btn">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 11.1H12v3.2h5.34c-.23 1.5-1.7 4.4-5.34 4.4-3.22 0-5.85-2.66-5.85-5.95s2.63-5.95 5.85-5.95c1.83 0 3.06.78 3.76 1.45l2.57-2.48C16.65 4.27 14.55 3.2 12 3.2c-5 0-9.05 4.05-9.05 9.05s4.05 9.05 9.05 9.05c5.22 0 8.68-3.67 8.68-8.83 0-.6-.07-1.05-.13-1.47z"/></svg>
          Continue with Google
        </button>
      </form>

      <p class="signup-line">Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </main>

  <footer>
    Focul · Close the loop on your work day
  </footer>
</body>
</html>
